<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>renderizando tabelas</title>
</head>
<body>
    <div class="containerTabela"> </div> <br>

    <script src="main.js"> </script>
    
    <style>
        .tabela
        {
            width: 90%;
            height: 800px;
            font-size: 18px;
            display: flex;
            justify-content:center;
            text-align:center;
            align-items:center;
            vertical-align:top;
            flex-direction: column;
        }

        .containerTabela
        {
            width: 100%;
            height: 700px;
            font-size: 18px;
            display: flex;
            justify-content:center;
            text-align:center;
            align-items:center;
            vertical-align:top;
            flex-direction: column;
        }

        .tabela th{
            border: 0.5px solid black;
            width: 125px;
            height: 46px;
            display: flex;
            justify-content:center;
            text-align:center;
            align-items:center;
            vertical-align:top;
            margin: none;
            padding: none;
        }

        .tabela td{
            border: 0.5px solid black;
            width: 125px;
            height: 30px;
            display: flex;
            justify-content:center;
            text-align:center;
            align-items:center;
            vertical-align:top;
            margin: none;
            padding: none;
        }

        .row-head{
            width: 645px;
            height: 50px;
            margin: none;
            padding: none;
            display: flex;
            justify-content:center;
            text-align:center;
            align-items:center;
            vertical-align:top;
            background-color: blueviolet;
        }

        .row-body{
            width: 645px;
            height: 34px;
            margin: none;
            padding: none;
            display: flex;
            justify-content:center;
            text-align:center;
            align-items:center;
            vertical-align:top;
        }

        .tabela tbody{
            width: 645px;
            height: 200px;
            margin: none;
            padding: none;
            display: flex;
            justify-content:start;
            text-align:start;
            align-items:start;
            vertical-align:top;
            flex-direction: column;
        }

        .tabela thead{
            width: 645px;
            height: 50px;
            margin: none;
            padding: none;
            display: flex;
            justify-content:center;
            text-align:center;
            align-items:center;
            vertical-align:top;
            flex-direction: column;
        }

        
    </style>

</body>
</html>
